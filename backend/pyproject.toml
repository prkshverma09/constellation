[project]
name = "constellation-backend"
version = "0.1.0"
description = "Mechanism-first rare-disease knowledge graph API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "httpx>=0.27",
  "duckdb>=1.1",
  "pyarrow>=17",
  "python-igraph>=0.11",
  "leidenalg>=0.10",
  "pyyaml>=6",
  "openai>=1.50",
  "openai-agents>=0.0.7",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["constellation", "tests"]
