services:
  - type: web
    name: constellation-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn constellation.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_MODE
        value: offline
      - key: CORS_ORIGIN_REGEX
        value: ^https://constellation[a-z0-9-]*\.vercel\.app$
